<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>凭证额度</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #fafafa;
    --bg-elevated: #ffffff;
    --bg-group: #f4f6f8;
    --border: #e5e5e5;
    --border-strong: #d9d9d9;
    --text: #1f1f1f;
    --text-dim: #8c8c8c;
    --primary: #1677ff;
    --primary-weak: rgba(22,119,255,.12);
    --ok: #389e0d;
    --warn: #d48806;
    --danger: #cf1322;
    --danger-weak: rgba(207,19,34,.10);
    --radius: 8px;
  }
  html[data-theme="dark"] {
    --bg: #141414;
    --bg-soft: #1b1b1b;
    --bg-elevated: #1f1f1f;
    --bg-group: #1a1a1a;
    --border: #303030;
    --border-strong: #424242;
    --text: #e6e6e6;
    --text-dim: #8b8b8b;
    --primary: #4096ff;
    --primary-weak: rgba(64,150,255,.16);
    --ok: #73d13d;
    --warn: #d8a33a;
    --danger: #ff7875;
    --danger-weak: rgba(255,120,117,.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    padding: 16px 18px 28px;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--border-strong);
    background: var(--bg-elevated); color: var(--text); padding: 5px 12px; transition: .15s;
  }
  button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
  button.danger { border-color: var(--danger); color: var(--danger); }
  button.danger:hover:not(:disabled) { background: var(--danger-weak); color: var(--danger); }
  button.small { padding: 3px 9px; font-size: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 14px 0 6px; }
  .tile { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; background: var(--bg-soft); }
  .tile .label { color: var(--text-dim); font-size: 12px; }
  .tile .value { font-size: 18px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); margin-top: 14px; overflow: hidden; background: var(--bg); }
  .card > header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--bg-soft); }
  .card > header h2 { font-size: 13px; font-weight: 600; margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-weight: 500; color: var(--text-dim); font-size: 12px; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover:not(.group):not(.editor) { background: var(--bg-soft); }
  tr.group > td { background: var(--bg-group); border-bottom: 1px solid var(--border); }
  .group-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .group-name { font-weight: 600; }
  .group-meta { color: var(--text-dim); font-size: 12px; }
  .name { font-weight: 500; word-break: break-all; }
  .name small { display: block; color: var(--text-dim); font-weight: 400; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; color: var(--text-dim); }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; min-width: 90px; }
  .bar > i { display: block; height: 100%; background: var(--primary); transition: width .25s; }
  .bar.warn > i { background: var(--warn); }
  .bar.danger > i { background: var(--danger); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid transparent; white-space: nowrap; }
  .tag.unlimited { color: var(--text-dim); border-color: var(--border-strong); }
  .tag.limited { color: var(--primary); border-color: var(--primary); }
  .tag.exhausted { color: var(--danger); border-color: var(--danger); background: var(--danger-weak); }
  .tag.missing { color: var(--warn); border-color: var(--warn); }
  tr.editor > td { background: var(--bg-soft); }
  .editor-grid { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .editor-grid label { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; }
  .editor-meta { color: var(--text-dim); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  input[type="text"], input[type="number"] {
    font: inherit; padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--border-strong); background: var(--bg-elevated); color: var(--text);
  }
  input[type="number"] { width: 92px; }
  input[type="text"] { width: 170px; }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-weak); }
  .muted { color: var(--text-dim); }
  .err { color: var(--danger); font-size: 12px; }
  .notice { border: 1px solid var(--warn); color: var(--warn); border-radius: var(--radius); padding: 8px 12px; margin-top: 12px; background: transparent; }
  .notice.danger { border-color: var(--danger); color: var(--danger); }
  .empty { padding: 28px 14px; text-align: center; color: var(--text-dim); }
  .audit { max-height: 220px; overflow: auto; }
  .audit ul { margin: 0; padding: 0 14px; }
  .audit li { list-style: none; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 12px; display: flex; gap: 10px; }
  .audit .t { color: var(--text-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(10px);
    background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--text);
    padding: 8px 16px; border-radius: 20px; box-shadow: 0 6px 18px rgba(0,0,0,.18);
    opacity: 0; pointer-events: none; transition: .2s; max-width: 80vw; font-size: 12px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>凭证额度</h1>
      <div class="sub">按上游凭证限制一次性美元额度。达到额度后该凭证停止被调度，<b>不会</b>自动重置，只能手动解封。</div>
    </div>
    <div class="actions">
      <button id="btn-sync">同步凭证</button>
      <button id="btn-price">刷新价目</button>
      <button id="btn-refresh" class="primary">刷新</button>
    </div>
  </div>

  <div id="notices"></div>

  <div class="tiles">
    <div class="tile"><div class="label">已记账凭证</div><div class="value" id="t-creds">–</div></div>
    <div class="tile"><div class="label">已设额度</div><div class="value" id="t-limited">–</div></div>
    <div class="tile"><div class="label">已停用</div><div class="value" id="t-exhausted">–</div></div>
    <div class="tile"><div class="label">累计消耗</div><div class="value" id="t-spent">–</div></div>
    <div class="tile"><div class="label">价目表</div><div class="value" id="t-price">–</div></div>
  </div>

  <div class="card">
    <header>
      <h2>凭证明细 · 按供应商分组</h2>
      <div class="actions">
        <button id="btn-unseal-all" class="small">全部解封</button>
      </div>
    </header>
    <div id="table-host">
      <div class="empty">加载中…</div>
    </div>
  </div>

  <div class="card">
    <header><h2>操作记录</h2><span class="muted" id="audit-hint"></span></header>
    <div class="audit"><ul id="audit"></ul></div>
  </div>

  <div id="toast"></div>

<script>
(function () {
  "use strict";
  var ID = "credential-budget";
  var BASE = "/v0/management/plugins/" + ID;
  var KEY_STORE = ID + ".key";
  var state = { data: null, busy: false, open: {} };

  // --- theme: follow the host console when it is same-origin, else the OS ---
  function parentTheme() {
    try {
      var doc = window.parent && window.parent !== window ? window.parent.document : null;
      if (!doc) return "";
      var root = doc.documentElement;
      var value = root.getAttribute("data-theme") || root.getAttribute("data-mode") || "";
      if (value) return value.indexOf("dark") >= 0 ? "dark" : "light";
      if (doc.body && doc.body.classList.contains("dark")) return "dark";
      return "";
    } catch (e) { return ""; }
  }
  function applyTheme() {
    var theme = parentTheme();
    if (!theme) {
      theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", theme);
  }
  applyTheme();
  if (window.matchMedia) {
    try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); } catch (e) {}
  }
  setInterval(applyTheme, 3000);

  // --- management key: read the CPA console's stored key when it exists ---
  function initialKey() {
    try {
      var raw = localStorage.getItem("cli-proxy-auth");
      if (raw && raw.indexOf("enc::v1::") === 0) {
        var secret = new TextEncoder().encode("cli-proxy-api-webui::secure-storage|" + location.host + "|" + navigator.userAgent);
        raw = new TextDecoder().decode(Uint8Array.from(atob(raw.slice(9)), function (c, i) {
          return c.charCodeAt(0) ^ secret[i % secret.length];
        }));
      }
      var parsed = raw ? JSON.parse(raw) : null;
      var key = parsed && parsed.state && parsed.state.managementKey;
      if (typeof key === "string" && key.trim()) return key.trim();
    } catch (e) {}
    try { return sessionStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; }
  }

  function request(path, options) {
    options = options || {};
    var headers = { "Accept": "application/json" };
    var key = initialKey();
    if (key) headers["Authorization"] = "Bearer " + key;
    if (options.body !== undefined) headers["Content-Type"] = "application/json";
    return fetch(BASE + path, {
      method: options.method || "GET",
      headers: headers,
      body: options.body === undefined ? undefined : JSON.stringify(options.body),
      cache: "no-store",
      credentials: "same-origin"
    }).then(function (response) {
      return response.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) {}
        if (!response.ok) {
          var message = (data && (data.error || (data.error && data.error.message))) || text || ("HTTP " + response.status);
          throw new Error(String(message).slice(0, 300));
        }
        return data;
      });
    });
  }

  function toast(message, isError) {
    var node = document.getElementById("toast");
    node.textContent = message;
    node.className = "show" + (isError ? " error" : "");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { node.className = ""; }, 3600);
  }

  function usd(value) {
    if (value === undefined || value === null) return "–";
    if (!value) return "$0";
    if (value < 0.01) return "$" + value.toFixed(6).replace(/0+$/, "").replace(/\.$/, "");
    return "$" + value.toFixed(2);
  }

  function esc(text) {
    return String(text === undefined || text === null ? "" : text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function timeText(value) {
    if (!value) return "";
    var date = new Date(value);
    if (isNaN(date.getTime())) return "";
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + " " +
      pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
  }

  var STATUS_TEXT = { unlimited: "未设额度", limited: "限额中", exhausted: "已停用" };

  function identity(row) {
    // The name cell: what the operator recognises first, then the facts that
    // separate two sibling keys of the same provider.
    var secondary = [];
    if (row.label && row.label !== row.display) secondary.push(row.label);
    if (row.base_url) secondary.push(row.base_url);
    secondary.push("#" + (row.tail || row.key));
    return esc(row.display) +
      '<small class="mono">' + esc(secondary.join(" · ")) + "</small>";
  }

  function renderRow(row) {
    var cls = row.exhausted ? "danger" : (row.usage_ratio > 0.8 ? "warn" : "");
    var ratio = Math.max(0, Math.min(1, row.usage_ratio || 0));
    var open = !!state.open[row.key];
    var html = "<tr>";
    html += '<td class="name">' + identity(row) +
      (row.missing ? ' <span class="tag missing">凭证已消失</span>' : "") + "</td>";
    html += '<td class="muted">' + esc(row.provider || "–") + "</td>";
    html += '<td class="num">' + usd(row.spent_usd) +
      (row.unpriced_requests ? '<small class="muted" style="display:block">' + row.unpriced_requests + " 次未定价</small>" : "") + "</td>";
    html += '<td class="num">' + (row.limit_usd ? usd(row.limit_usd) : '<span class="muted">不限</span>') + "</td>";
    html += '<td><div class="bar ' + cls + '"><i style="width:' + (ratio * 100).toFixed(1) + '%"></i></div></td>';
    html += '<td><span class="tag ' + row.status + '">' + (STATUS_TEXT[row.status] || row.status) + "</span>" +
      (row.disabled_by_plugin ? '<small class="muted" style="display:block">已置为 disabled</small>' : "") +
      (row.disable_error ? '<small class="err" style="display:block" title="' + esc(row.disable_error) + '">禁用失败</small>' : "") + "</td>";
    html += '<td class="muted num">' + (row.last_request_at ? timeText(row.last_request_at) : "–") +
      (row.last_model ? '<small class="mono" style="display:block">' + esc(row.last_model) + "</small>" : "") + "</td>";
    html += '<td><div class="actions">' +
      '<button class="small" data-act="edit" data-key="' + esc(row.key) + '">' + (open ? "收起" : "设置") + "</button>" +
      '<button class="small danger" data-act="unseal" data-key="' + esc(row.key) + '">解封</button>' +
      "</div></td>";
    html += "</tr>";

    if (open) {
      html += '<tr class="editor"><td colspan="8"><div class="editor-grid">' +
        "<label>备注名 <input type=\"text\" data-field=\"alias\" data-key=\"" + esc(row.key) + "\" value=\"" + esc(row.alias || "") + "\" placeholder=\"比如 5刀-A\" maxlength=\"64\" /></label>" +
        "<label>额度 $ <input type=\"number\" min=\"0\" step=\"0.5\" data-field=\"limit\" data-key=\"" + esc(row.key) + "\" value=\"" + (row.limit_usd || 0) + "\" /></label>" +
        '<button class="small primary" data-act="save" data-key="' + esc(row.key) + '">保存</button>' +
        '<span class="editor-meta">' +
        "<span>凭证 ID <span class=\"mono\">" + esc(row.key) + "</span></span>" +
        (row.name ? "<span>文件 <span class=\"mono\">" + esc(row.name) + "</span></span>" : "") +
        (row.last_cost_usd ? "<span>上次计费 " + usd(row.last_cost_usd) + "</span>" : "") +
        "</span></div></td></tr>";
    }
    return html;
  }

  function renderGroup(group, rows) {
    var html = '<tr class="group"><td colspan="8"><div class="group-line">' +
      '<span class="group-name">' + esc(group.provider) + "</span>" +
      '<span class="group-meta">' + group.count + " 条 · 已设额度 " + group.limited + " · 已停用 " + group.exhausted +
      " · 合计 " + usd(group.spent_usd) + "</span>" +
      "</div></td></tr>";
    rows.forEach(function (row) { html += renderRow(row); });
    return html;
  }

  function render() {
    var data = state.data;
    if (!data) return;
    var totals = data.totals || {};
    document.getElementById("t-creds").textContent = totals.credentials || 0;
    document.getElementById("t-limited").textContent = totals.limited || 0;
    document.getElementById("t-exhausted").textContent = totals.exhausted || 0;
    document.getElementById("t-spent").textContent = usd(totals.spent_usd);
    var book = data.price_book || {};
    document.getElementById("t-price").textContent = (book.models || 0) + " 个模型";
    document.getElementById("t-price").title = book.fetched_at
      ? "抓取于 " + timeText(book.fetched_at) + (book.last_error ? "；最近一次失败：" + book.last_error : "")
      : "价目表为空";

    var notices = [];
    if (data.storage_error) notices.push('<div class="notice danger">账本写入已暂停：' + esc(data.storage_error) + "</div>");
    if (book.last_error) notices.push('<div class="notice">价目表刷新失败（仍在用上次的缓存）：' + esc(book.last_error) + "</div>");
    if (data.config && data.config.enforce === false) notices.push('<div class="notice">已关闭 enforce：当前只记账，不会停止凭证。</div>');
    if (data.config && data.config.auto_disable === false) notices.push('<div class="notice">已关闭 auto_disable：只靠调度拦截，凭证在面板里仍显示为可用。</div>');
    document.getElementById("notices").innerHTML = notices.join("");

    var rows = data.credentials || [];
    var host = document.getElementById("table-host");
    if (!rows.length) {
      host.innerHTML = '<div class="empty">还没有记录。凭证第一次被使用后会自动出现在这里。<br />如果刚部署插件，点右上角「同步凭证」先拉一次清单。</div>';
      return;
    }
    var byProvider = {};
    rows.forEach(function (row) {
      var name = row.provider || "未标注供应商";
      (byProvider[name] = byProvider[name] || []).push(row);
    });
    var order = Object.keys(byProvider).sort();
    var html = '<table><thead><tr>' +
      '<th style="min-width:230px">凭证</th><th>供应商</th><th>已用</th><th>额度</th>' +
      '<th style="min-width:110px">进度</th><th>状态</th><th>最近使用</th><th style="min-width:120px">操作</th>' +
      "</tr></thead><tbody>";
    order.forEach(function (name) {
      var group = (data.groups || []).filter(function (g) { return g.provider === name; })[0] || {
        provider: name, count: byProvider[name].length, limited: 0, exhausted: 0, spent_usd: 0
      };
      html += renderGroup(group, byProvider[name]);
    });
    html += "</tbody></table>";
    host.innerHTML = html;

    var audit = data.audit || [];
    var list = document.getElementById("audit");
    if (!audit.length) {
      list.innerHTML = '<li class="muted">暂无记录</li>';
    } else {
      list.innerHTML = audit.slice().reverse().map(function (entry) {
        return '<li><span class="t">' + timeText(entry.at) + "</span><span>" + esc(entry.action) +
          (entry.key ? " · " + esc(entry.key) : "") +
          (entry.detail ? " · " + esc(entry.detail) : "") + "</span></li>";
      }).join("");
    }
  }

  function load() {
    return request("/state").then(function (data) {
      state.data = data;
      render();
    }).catch(function (error) {
      document.getElementById("table-host").innerHTML = '<div class="empty err">' + esc(error.message) + "</div>";
      throw error;
    });
  }

  function withBusy(promise) {
    if (state.busy) return Promise.resolve();
    state.busy = true;
    document.querySelectorAll("button").forEach(function (button) { button.disabled = true; });
    var finish = function () {
      state.busy = false;
      document.querySelectorAll("button").forEach(function (button) { button.disabled = false; });
    };
    return promise.then(finish, function (error) {
      finish();
      toast(error.message || "操作失败", true);
    });
  }

  function fieldValue(selector) {
    var node = document.querySelector(selector);
    return node ? node.value : "";
  }

  document.getElementById("btn-refresh").addEventListener("click", function () { withBusy(load().catch(function () {})); });

  document.getElementById("btn-sync").addEventListener("click", function () {
    withBusy(request("/sync", { method: "POST", body: {} }).then(function (data) {
      state.data = data; render(); toast("已同步凭证清单");
    }));
  });

  document.getElementById("btn-price").addEventListener("click", function () {
    withBusy(request("/price/sync", { method: "POST", body: {} }).then(function () {
      return load().then(function () { toast("价目表已刷新"); });
    }));
  });

  document.getElementById("btn-unseal-all").addEventListener("click", function () {
    if (!confirm("解封全部已停用凭证？已用金额会清零，凭证重新参与调度。")) return;
    withBusy(request("/unseal-all", { method: "POST", body: {} }).then(function (result) {
      var count = (result && result.unsealed && result.unsealed.length) || 0;
      var warnings = (result && result.warnings) || [];
      return load().then(function () {
        toast("已解封 " + count + " 个凭证" + (warnings.length ? "，" + warnings.length + " 个有警告" : ""), warnings.length > 0);
      });
    }));
  });

  document.getElementById("table-host").addEventListener("click", function (event) {
    var button = event.target.closest("button[data-act]");
    if (!button) return;
    var act = button.getAttribute("data-act");
    var key = button.getAttribute("data-key") || "";

    if (act === "edit") {
      state.open[key] = !state.open[key];
      render();
      return;
    }

    if (act === "save") {
      var alias = fieldValue('input[data-field="alias"][data-key="' + CSS.escape(key) + '"]');
      var limit = parseFloat(fieldValue('input[data-field="limit"][data-key="' + CSS.escape(key) + '"]'));
      if (!isFinite(limit) || limit < 0) { toast("额度必须是不小于 0 的数字", true); return; }
      withBusy(request("/alias", { method: "POST", body: { key: key, alias: alias } }).then(function () {
        return request("/limits", { method: "POST", body: { key: key, limit_usd: limit } });
      }).then(function (result) {
        return load().then(function () {
          if (result && result.requires_unseal) {
            toast("已保存。额度高于已用，但凭证仍是停用状态，点「解封」后才会重新调度。", true);
          } else {
            toast("已保存");
          }
        });
      }));
      return;
    }

    if (act === "unseal") {
      if (!confirm("解封该凭证？已用金额会清零，凭证重新参与调度。")) return;
      withBusy(request("/unseal", { method: "POST", body: { key: key } }).then(function (result) {
        return load().then(function () {
          toast(result && result.warning ? result.warning : "已解封", !!(result && result.warning));
        });
      }));
    }
  });

  load().catch(function () {});
  setInterval(function () { if (!state.busy) load().catch(function () {}); }, 15000);
})();
</script>
</body>
</html>
